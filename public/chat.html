<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naiz · Нууц чат</title>
<link rel="stylesheet" href="/styles.css">
<script>
// First visit: show the 3-step welcome. Stored only in this browser.
try { if (!localStorage.getItem('naiz-onboarded') && !location.search.includes('skip')) location.replace('/welcome'); } catch {}
</script>
</head>
<body>
<div class="wrap">
  <header class="bar">
    <span class="pill safe left" data-t="anon">Нэргүй</span>
    <a class="brand" href="/">Naiz</a>
    <button id="lang" type="button" aria-label="Switch language">EN</button>
  </header>

  <section class="card hero">
    <span class="eyebrow" data-t="eyebrow">Эмч хянасан · Нууцлалтай</span>
    <h1 data-t="title">Юу ч асуугаарай, нууцаар</h1>
    <p class="muted" data-t="intro">БЗДХ, сарын тэмдэг, жирэмслэлтээс хамгаалах, харилцаа. Хариулт бүрийг эмч хянадаг. Таны нэрийг асуухгүй.</p>
    <div class="chips" id="chips"></div>
  </section>

  <div class="features">
    <a class="feature" href="/check">
      <span class="ico purple"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 12l2 2 4-4"/></svg></span>
      <span data-t="fCheck">2 минутын шалгалт</span>
    </a>
    <a class="feature" href="/check#clinics">
      <span class="ico blue"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><path d="M12 7v5M9.5 9.5h5"/></svg></span>
      <span data-t="fClinics">Үнэгүй эмнэлэг</span>
    </a>
    <a class="feature" href="/feedback">
      <span class="ico pink"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"/></svg></span>
      <span data-t="fFeedback">Санал өгөх</span>
    </a>
  </div>

  <div class="chat" id="chat" aria-live="polite"></div>
</div>

<form class="ask" id="ask">
  <div class="inner">
    <label for="q" class="sr-only" data-t="label">Таны асуулт</label>
    <textarea id="q" rows="1" maxlength="1000" placeholder="Асуултаа бичнэ үү…"></textarea>
    <button class="primary" type="submit" data-t="send">Илгээх</button>
  </div>
</form>

<script>
const T = {
  mn: {
    anon: 'Нэргүй', eyebrow: 'Эмч хянасан · Нууцлалтай', title: 'Юу ч асуугаарай, нууцаар',
    fCheck: '2 минутын шалгалт', fClinics: 'Үнэгүй эмнэлэг', fFeedback: 'Санал өгөх',
    intro: 'БЗДХ, сарын тэмдэг, жирэмслэлтээс хамгаалах, харилцаа. Хариулт бүрийг эмч хянадаг. Таны нэрийг асуухгүй.',
    checkLink: 'Шинжилгээ өгөх хэрэгтэй юу? 2 минутын шалгалт', label: 'Таны асуулт', send: 'Илгээх',
    placeholder: 'Асуултаа бичнэ үү…', helpful: 'Тустай байлаа', notHelpful: 'Тус болсонгүй', thanks: 'Баярлалаа!',
    thinking: '…', error: 'Алдаа гарлаа. Дахин оролдоно уу.',
    chips: ['Ялгадас минь хэвийн үү?', 'ХПВ гэж юу вэ?', 'Эцэг эх маань мэдэх үү?', 'Тэмбүү эдгэрдэг үү?'],
  },
  en: {
    anon: 'Anonymous', eyebrow: 'Doctor-reviewed · Private', title: 'Ask anything, privately',
    fCheck: '2-minute check', fClinics: 'Free clinics', fFeedback: 'Give feedback',
    intro: 'STIs, periods, contraception, relationships. Every answer is reviewed by doctors. We never ask your name.',
    checkLink: 'Should I get checked? 2-minute check', label: 'Your question', send: 'Send',
    placeholder: 'Type your question…', helpful: 'Helpful', notHelpful: 'Not helpful', thanks: 'Thank you!',
    thinking: '…', error: 'Something went wrong. Please try again.',
    chips: ['Is my discharge normal?', 'What is HPV?', 'Will my parents find out?', 'Can syphilis be cured?'],
  },
};
let lang = 'mn';
const chat = document.getElementById('chat');
const q = document.getElementById('q');

function render() {
  const t = T[lang];
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-t]').forEach((el) => { el.textContent = t[el.dataset.t]; });
  q.placeholder = t.placeholder;
  document.getElementById('lang').textContent = lang === 'mn' ? 'EN' : 'МН';
  const chips = document.getElementById('chips');
  chips.replaceChildren(...t.chips.map((c) => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = c;
    b.addEventListener('click', () => ask(c));
    return b;
  }));
}

function bubble(text, who) {
  const d = document.createElement('div');
  d.className = `msg ${who}`;
  d.textContent = text;
  chat.appendChild(d);
  d.scrollIntoView({ behavior: 'smooth', block: 'end' });
  return d;
}

function feedback(bot, refs) {
  const t = T[lang];
  const row = document.createElement('div');
  row.className = 'feedback';
  for (const [label, helpful] of [[t.helpful, true], [t.notHelpful, false]]) {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = label;
    b.addEventListener('click', async () => {
      await fetch('/api/feedback', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ helpful, refs }) });
      row.replaceChildren(Object.assign(document.createElement('span'), { className: 'muted', textContent: t.thanks }));
    });
    row.appendChild(b);
  }
  bot.appendChild(row);
}

async function ask(text) {
  const question = String(text).trim();
  if (!question) return;
  bubble(question, 'me');
  q.value = '';
  const bot = bubble(T[lang].thinking, 'bot');
  try {
    const res = await fetch('/api/ask', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ q: question }) });
    const data = await res.json();
    bot.textContent = data.answer || data.error || T[lang].error;
    if (data.answer && !data.flag) feedback(bot, data.refs || []);
  } catch {
    bot.textContent = T[lang].error;
  }
}

document.getElementById('ask').addEventListener('submit', (e) => { e.preventDefault(); ask(q.value); });
q.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(q.value); } });
document.getElementById('lang').addEventListener('click', () => { lang = lang === 'mn' ? 'en' : 'mn'; render(); });
render();
</script>
<script src="/nav.js"></script>
</body>
</html>
