<title>Naiz · Нууц шалгалт</title>
<link rel="stylesheet" href="/styles.css">

<body>
<div class="wrap">
  <header class="bar">
    <span class="pill safe left" id="anon"></span>
    <a class="brand" href="/">Naiz</a>
    <button id="lang" type="button" aria-label="Switch language">EN</button>
  </header>

  <div class="card hero">
    <span class="eyebrow" id="eyebrow"></span>
    <h1 id="title"></h1>
    <p class="muted" id="subtitle"></p>
  </div>

  <form id="form"></form>
  <div id="result" aria-live="polite"></div>
  <div id="clinics"></div>
</div>

    tests: {
      swab: 'Swab test: chlamydia, gonorrhoea, trichomoniasis', blood: 'Blood test: syphilis, HIV', exam: 'An exam by a doctor',

    },

    youth: "If you're under 18, adolescent-friendly health rooms give free, confidential advice.",
    disclaimer: "This isn't a diagnosis. Only a test can tell.",
    clinicsTitle: 'Where to get tested', free: 'Free', partner: 'Verified partner clinic', chat: 'Questions? Chat with us',
  },
};

let lang = 'mn';
const form = document.getElementById('form');
const el = (tag, props = {}, ...kids) => {
  const n = Object.assign(document.createElement(tag), props);
  n.append(...kids);
  return n;
};

function radioGroup(name, legend, options) {
  const fs = el('fieldset', {}, el('legend', { textContent: legend }));
  for (const [value, label] of options) {
    const input = el('input', { type: 'radio', name, value });
    fs.append(el('label', { className: 'opt' }, input, el('span', { textContent: label })));
  }
  return fs;
}
function checkGroup(name, legend, options) {
  const fs = el('fieldset', {}, el('legend', { textContent: legend }));
  for (const [value, label] of options) {
    const input = el('input', { type: 'checkbox', name, value });
    fs.append(el('label', { className: 'opt' }, input, el('span', { textContent: label })));
  }
  return fs;
}

function renderForm() {
  const t = T[lang];
  document.documentElement.lang = lang;
  for (const id of ['anon', 'eyebrow', 'title', 'subtitle']) document.getElementById(id).textContent = t[id];
  document.getElementById('lang').textContent = lang === 'mn' ? 'EN' : 'МН';

  const age = el('fieldset', {}, el('legend', { textContent: t.age }));
  const ageInput = el('input', { type: 'number', name: 'age', min: 12, max: 80, required: true, id: 'age' });
  age.append(el('label', { htmlFor: 'age', className: 'sr-only', textContent: t.age }), ageInput);

  const yn = [['yes', t.yes], ['no', t.no], ['prefer', t.prefer]];
  const screening = radioGroup('lastScreening', t.lastScreening, [['never', t.never], ['over3y', t.over3y], ['within3y', t.within3y], ['unknown', t.unknown]]);
  screening.hidden = true;
  ageInput.addEventListener('input', () => { const a = Number(ageInput.value); screening.hidden = !(a >= 30 && a <= 60); });

  form.replaceChildren(
    age,
    radioGroup('everSex', t.everSex, yn),
    checkGroup('symptoms', t.symptoms, Object.entries(t.s)),
    checkGroup('now', t.now, [['fever', t.fever], ['severePain', t.severePain], ['heavyBleeding', t.heavyBleeding]]),
    radioGroup('maybePregnant', t.maybePregnant, [['yes', t.yes], ['no', t.no], ['notSure', t.notSure]]),
    radioGroup('newPartnerNoCondom', t.newPartner, yn),
    radioGroup('partnerHasSTI', t.partnerSTI, [['yes', t.yes], ['no', t.no], ['notSure', t.notSure]]),
    radioGroup('lastSTITest', t.lastTest, [['never', t.never], ['over1y', t.over1y], ['within1y', t.within1y]]),
    screening,
    radioGroup('assault', t.assault, yn),
    el('button', { type: 'submit', className: 'primary', textContent: t.submit, style: 'width:100%;margin-bottom:16px' }),
  );
}

function collect() {
  const fd = new FormData(form);
  const v = (k) => fd.get(k);
  const now = fd.getAll('now');
  return {
    age: Number(v('age')),
    sexuallyActive: v('everSex') === 'yes',
    symptoms: fd.getAll('symptoms'),
    fever: now.includes('fever'),
    severePain: now.includes('severePain'),
    heavyBleeding: now.includes('heavyBleeding'),
    maybePregnant: ['yes', 'notSure'].includes(v('maybePregnant')),
    newPartnerNoCondom: v('newPartnerNoCondom') === 'yes',
    partnerHasSTI: v('partnerHasSTI') === 'yes',
    lastSTITest: v('lastSTITest') || 'never',
    lastScreening: v('lastScreening') || 'unknown',
    assault: v('assault') === 'yes',
  };
}

function showResult(r) {
  const t = T[lang];
  const [head, body] = t.level[r.level];
  const box = el('div', { className: `alert ${r.level}` }, el('h2', { textContent: head }), el('p', { textContent: r.special === 'assault' ? t.assaultMsg : body, style: 'margin:0' }));
  const parts = [box];
  if (r.tests.length) {
    const list = el('ul', { style: 'margin:0;padding-left:20px' }, ...r.tests.map((x) => el('li', { textContent: t.tests[x] || x })));
    parts.push(el('div', { className: 'card' }, el('h2', { textContent: t.testsTitle }), list));
  }
  if (r.youth) parts.push(el('div', { className: 'alert routine', textContent: t.youth }));
  parts.push(el('p', { className: 'muted', textContent: t.disclaimer }));
  parts.push(el('p', {}, el('a', { className: 'btn', href: '/', textContent: t.chat })));
  document.getElementById('result').replaceChildren(...parts);
  showClinics();
  box.scrollIntoView({ behavior: 'smooth' });
}

async function showClinics() {
  const t = T[lang];
  const list = await (await fetch('/api/clinics')).json();
  const cards = list.map((c) =>
    el('div', { className: 'card' },
      el('h2', { textContent: c.name }),
      el('span', { className: `tag ${c.free ? 'free' : 'paid'}`, textContent: c.free ? t.free : t.partner }),
      el('p', { className: 'muted', textContent: `${c.services.join(' · ')}` }),
      el('p', { className: 'muted', textContent: `${c.address} · ${c.hours} · ${c.phone}` })));
  document.getElementById('clinics').replaceChildren(el('div', { className: 'section-title' }, el('h2', { id: 'clinics-title', textContent: t.clinicsTitle })), ...cards);
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const res = await fetch('/api/check', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(collect()) });
  showResult(await res.json());
});
document.getElementById('lang').addEventListener('click', () => { lang = lang === 'mn' ? 'en' : 'mn'; renderForm(); document.getElementById('result').replaceChildren(); document.getElementById('clinics').replaceChildren(); });
renderForm();
async function openClinicsFromHash() {
  if (location.hash !== '#clinics') return;
  await showClinics();
  document.getElementById('clinics').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
window.addEventListener('hashchange', openClinicsFromHash);
openClinicsFromHash();
</script>
<script src="/nav.js"></script>
</body>
</html>
