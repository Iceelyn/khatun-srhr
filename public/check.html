<!doctype html>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Naiz · Нууц асуумж</title>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="wrap">
  <header class="bar">
    <span class="pill safe left" id="anon"></span>
    <a class="brand" href="/">Naiz</a>
    <button id="lang" type="button" aria-label="Switch language">EN</button>
  </header>

  <div class="card hero" id="hero">
    <span class="eyebrow" id="eyebrow"></span>
    <h1 id="title"></h1>
    <p class="muted" id="subtitle"></p>
  </div>

  <form id="form"></form>
  <section id="resultView" hidden aria-labelledby="result-title">
    <div class="stepper" aria-hidden="true"><span class="done" id="stepCheck"></span><span class="line"></span><span class="current" id="stepResult"></span></div>
    <button type="button" class="ghost back" id="back"></button>
    <h1 id="result-title" tabindex="-1"></h1>
    <div id="result" aria-live="polite"></div>
  </section>
  <div id="clinics"></div>
</div>

// English first (for reviewers); ?lang=mn for links shared with our users. The choice is remembered.
let lang = (() => {
  const q = new URLSearchParams(location.search).get('lang');
  if (q === 'mn' || q === 'en') return q;
  try { const saved = localStorage.getItem('naiz-lang'); if (saved === 'mn' || saved === 'en') return saved; } catch {}
  return 'en';
})();
const saveLang = () => { try { localStorage.setItem('naiz-lang', lang); } catch {} };
const form = document.getElementById('form');
const el = (tag, props = {}, ...kids) => {
  const n = Object.assign(document.createElement(tag), props);
  n.append(...kids.filter((k) => k != null));
  return n;
};

function radioGroup(name, legend, options) {
  const fs = el('fieldset', {}, el('legend', { textContent: legend }));
  for (const [value, label] of options) {
    const input = el('input', { type: 'radio', name, value });
    fs.append(el('label', { className: 'opt' }, input, el('span', { textContent: label })));
  }
  return fs;
}
function checkGroup(name, legend, options) {
  const fs = el('fieldset', {}, el('legend', { textContent: legend }));
  for (const [value, label] of options) {
    const input = el('input', { type: 'checkbox', name, value });
    fs.append(el('label', { className: 'opt' }, input, el('span', { textContent: label })));
  }
  return fs;
}

function renderForm() {
  const t = T[lang];
  document.documentElement.lang = lang;
  for (const id of ['anon', 'eyebrow', 'title', 'subtitle']) document.getElementById(id).textContent = t[id];
  document.getElementById('lang').textContent = lang === 'mn' ? 'EN' : 'МН';

  const age = el('fieldset', {}, el('legend', { textContent: t.age }));
  const ageInput = el('input', { type: 'number', name: 'age', min: 12, max: 80, required: true, id: 'age' });
  age.append(el('label', { htmlFor: 'age', className: 'sr-only', textContent: t.age }), ageInput);

  const yn = [['yes', t.yes], ['no', t.no], ['prefer', t.prefer]];
  const screening = radioGroup('lastScreening', t.lastScreening, [['never', t.never], ['over3y', t.over3y], ['within3y', t.within3y], ['unknown', t.unknown]]);
  screening.hidden = true;
  ageInput.addEventListener('input', () => { const a = Number(ageInput.value); screening.hidden = !(a >= 30 && a <= 60); });

  form.replaceChildren(
    age,
    radioGroup('everSex', t.everSex, yn),
    checkGroup('symptoms', t.symptoms, [...Object.entries(t.s), ['none', t.noneOfThese]]),
    checkGroup('now', t.now, [['fever', t.fever], ['severePain', t.severePain], ['heavyBleeding', t.heavyBleeding]]),
    radioGroup('maybePregnant', t.maybePregnant, [['yes', t.yes], ['no', t.no], ['notSure', t.notSure]]),
    radioGroup('newPartnerNoCondom', t.newPartner, [['yes', t.yes], ['no', t.no], ['noSex', t.noSex], ['prefer', t.prefer]]),
    radioGroup('partnerHasSTI', t.partnerSTI, [['yes', t.yes], ['no', t.no], ['notSure', t.notSure]]),
    radioGroup('lastSTITest', t.lastTest, [['never', t.never], ['over1y', t.over1y], ['within1y', t.within1y]]),
    screening,
    radioGroup('assault', t.assault, yn),
    el('button', { type: 'submit', className: 'primary', textContent: t.submit, style: 'width:100%;margin-bottom:16px' }),
  );

  // "None of these" can't be ticked together with a symptom (W01: there was no answer for "no symptoms").
  const sym = [...form.querySelectorAll('input[name=symptoms]')];
  for (const box of sym) box.addEventListener('change', () => {
    if (!box.checked) return;
    for (const other of sym) if ((box.value === 'none') !== (other.value === 'none')) other.checked = false;
  });

  // Questions about sex only make sense if she has had sex (W05: no answer for "haven't had sex").
  const sexOnly = ['maybePregnant', 'newPartnerNoCondom', 'partnerHasSTI'].map((n) => form.querySelector(`input[name=${n}]`).closest('fieldset'));
  const syncSexQuestions = () => {
    const never = form.querySelector('input[name=everSex][value=no]').checked;
    for (const fs of sexOnly) {
      fs.hidden = never;
      if (never) fs.querySelectorAll('input').forEach((i) => { i.checked = false; });
    }
  };
  form.querySelectorAll('input[name=everSex]').forEach((i) => i.addEventListener('change', syncSexQuestions));
}

function collect() {
  const fd = new FormData(form);
  const v = (k) => fd.get(k);
  const now = fd.getAll('now');
  return {
    age: Number(v('age')),
    sexuallyActive: v('everSex') === 'yes',
    symptoms: fd.getAll('symptoms').filter((x) => x !== 'none'),
    fever: now.includes('fever'),
    severePain: now.includes('severePain'),
    heavyBleeding: now.includes('heavyBleeding'),
    maybePregnant: ['yes', 'notSure'].includes(v('maybePregnant')),
    newPartnerNoCondom: v('newPartnerNoCondom') === 'yes',
    partnerHasSTI: v('partnerHasSTI') === 'yes',
    lastSTITest: v('lastSTITest') || 'never',
    lastScreening: v('lastScreening') || 'unknown',
    assault: v('assault') === 'yes',
  };
}

// The result is its own screen: the questions are hidden, the result starts at the top,
// and Back (button or browser) returns to the answers, which are kept.
let lastResult = null;

function setView(view) {
  const result = view === 'result';
  document.getElementById('hero').hidden = result;
  form.hidden = result;
  document.getElementById('resultView').hidden = !result;
  if (!result) document.getElementById('clinics').replaceChildren();
}

function showResult(r, { push = true } = {}) {
  lastResult = r;
  const t = T[lang];
  const [head, body] = t.level[r.level];
  document.getElementById('stepCheck').textContent = '✓ ' + t.stepCheck;
  document.getElementById('stepResult').textContent = t.stepResult;
  document.getElementById('back').textContent = t.back;
  document.getElementById('result-title').textContent = t.resultTitle;
  const box = el('div', { className: `alert big ${r.level}` }, el('h2', { textContent: head }), el('p', { textContent: r.special === 'assault' ? t.assaultMsg : body, style: 'margin:0' }));
  const parts = [box];
  // W02, W06: the result was too short and didn't say why; the list of tests felt scary.
  if (r.special !== 'assault') parts.push(el('div', { className: 'card why' }, el('h3', { textContent: t.whyTitle }), el('p', { textContent: t.why[r.level] })));
  if (r.youth) parts.push(el('div', { className: 'alert routine', textContent: t.youth }));
  parts.push(el('div', { className: 'section-title' }, el('h2', { textContent: t.nextTitle })));
  let n = 0;
  const step = (title, ...body) => el('div', { className: 'card next-step' }, el('span', { className: 'num', textContent: String(++n) }), el('div', {}, el('h3', { textContent: title }), ...body));
  if (r.tests.length) parts.push(step(t.step1, el('ul', {}, ...r.tests.map((x) => el('li', { textContent: t.tests[x] || x }))), el('p', { className: 'muted reassure', textContent: t.reassure })));
  parts.push(step(t.step2, el('p', {}, el('a', { className: 'link', href: '#clinics-title', textContent: t.clinicsTitle + ' ↓' }))));
  parts.push(step(t.step3, el('p', {}, el('a', { className: 'link', href: '/', textContent: t.openChat }))));
  parts.push(el('p', { className: 'muted', textContent: t.disclaimer }));
  document.getElementById('result').replaceChildren(...parts);
  setView('result');
  if (push && history.state?.view !== 'result') history.pushState({ view: 'result' }, '', location.pathname);
  showClinics().then(() => document.getElementById('clinics').append(
    el('button', { type: 'button', className: 'btn block', textContent: t.restart, style: 'margin:8px 0 16px', onclick: restart })));
  window.scrollTo(0, 0);
  document.getElementById('result-title').focus({ preventScroll: true });
}

function backToForm() {
  setView('form');
  window.scrollTo(0, 0);
}

function restart() {
  form.reset();
  renderForm();
  lastResult = null;
  if (history.state?.view === 'result') history.back(); else backToForm();
}

document.getElementById('back').addEventListener('click', () => (history.state?.view === 'result' ? history.back() : backToForm()));
window.addEventListener('popstate', () => { if (history.state?.view === 'result' && lastResult) showResult(lastResult, { push: false }); else backToForm(); });

async function showClinics() {
  const t = T[lang];
  const list = await (await fetch('/api/clinics')).json();
  const cards = list.map((c) =>
    el('div', { className: 'card' },
      el('h2', { textContent: c.name }),
      el('span', { className: `tag ${c.free ? 'free' : 'paid'}`, textContent: c.free ? t.free : t.partner }),
      el('p', { className: 'muted', textContent: c.services.join(' · ') }),
      el('p', { className: 'muted', textContent: [c.address, c.hours, c.phone].filter(Boolean).join(' · ') }),
      c.website ? el('p', { className: 'muted' }, el('a', { href: c.website, target: '_blank', rel: 'noopener', className: 'link', textContent: t.website })) : null));
  document.getElementById('clinics').replaceChildren(el('div', { className: 'section-title' }, el('h2', { id: 'clinics-title', textContent: t.clinicsTitle })), el('p', { className: 'muted', textContent: t.callFirst }), ...cards);
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const res = await fetch('/api/check', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(collect()) });
  showResult(await res.json());
});
document.getElementById('lang').addEventListener('click', () => {
  lang = lang === 'mn' ? 'en' : 'mn'; saveLang();
  const answers = new FormData(form);
  renderForm();
  for (const [k, v] of answers) { // keep answers when switching language
    const input = form.querySelector(`[name="${k}"][value="${CSS.escape(String(v))}"]`) || form.querySelector(`[name="${k}"]:not([type=radio]):not([type=checkbox])`);
    if (!input) continue;
    if (input.type === 'radio' || input.type === 'checkbox') input.checked = true; else { input.value = v; input.dispatchEvent(new Event('input')); }
  }
  if (!document.getElementById('resultView').hidden && lastResult) showResult(lastResult, { push: false });
  else document.getElementById('clinics').replaceChildren();
});
renderForm();
async function openClinicsFromHash() {
  if (location.hash !== '#clinics') return;
  await showClinics();
  document.getElementById('clinics').scrollIntoView({ behavior: 'smooth', block: 'start' });
}
window.addEventListener('hashchange', openClinicsFromHash);
openClinicsFromHash();
</script>
<script src="/nav.js"></script>
